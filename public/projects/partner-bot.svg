<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Telegram partner bot project cover</title><desc id="desc">Dark blue interface mockup with Telegram messages and automation nodes.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset=".55" stop-color="#112b46"/><stop offset="1" stop-color="#0a1829"/></linearGradient><radialGradient id="glow"><stop stop-color="#37aee2" stop-opacity=".72"/><stop offset="1" stop-color="#37aee2" stop-opacity="0"/></radialGradient><filter id="shadow"><feDropShadow dx="0" dy="22" stdDeviation="24" flood-opacity=".28"/></filter></defs>
  <rect width="1200" height="800" fill="url(#bg)"/><circle cx="920" cy="150" r="330" fill="url(#glow)" opacity=".42"/><circle cx="160" cy="680" r="280" fill="url(#glow)" opacity=".18"/>
  <g opacity=".23" stroke="#8ed9ff"><path d="M0 160h1200M0 320h1200M0 480h1200M0 640h1200M200 0v800M400 0v800M600 0v800M800 0v800M1000 0v800"/></g>
  <g filter="url(#shadow)" transform="translate(260 72)"><rect width="680" height="656" rx="54" fill="#f7fbff"/><rect x="0" y="0" width="680" height="105" rx="54" fill="#fff"/><circle cx="62" cy="53" r="30" fill="#2aabee"/><path d="m46 51 31-12c4-1 6 1 5 5l-6 29c-1 4-4 5-7 3l-10-8-5 5c-1 1-2 2-4 2l1-11 20-18c1-1 0-2-2-1L44 61c-3 1-5 0-5-2z" fill="#fff"/><text x="108" y="48" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#162538">AK US FORVARD</text><text x="108" y="76" font-family="Arial,sans-serif" font-size="16" fill="#6c7b8b">partner assistant · online</text>
    <g font-family="Arial,sans-serif"><rect x="38" y="142" width="420" height="86" rx="24" fill="#e9f1f7"/><text x="64" y="176" font-size="18" fill="#1c2b3d">Welcome! How can we help?</text><text x="64" y="204" font-size="15" fill="#627184">Choose an option to continue.</text><rect x="175" y="254" width="467" height="78" rx="24" fill="#d8f2ff"/><text x="205" y="301" font-size="18" fill="#16334a">I want to become a supplier partner</text><rect x="38" y="359" width="514" height="150" rx="24" fill="#e9f1f7"/><text x="64" y="396" font-size="18" font-weight="700" fill="#1c2b3d">Great — let's start your inquiry.</text><text x="64" y="430" font-size="16" fill="#627184">We'll collect the company details</text><text x="64" y="455" font-size="16" fill="#627184">and send them to the right team.</text><rect x="64" y="474" width="218" height="48" rx="24" fill="#2aabee"/><text x="91" y="505" font-size="16" font-weight="700" fill="#fff">Start application</text></g>
  </g>
  <g fill="#fff" font-family="Arial,sans-serif"><text x="72" y="104" font-size="18" letter-spacing="4" opacity=".55">XFLARE / AUTOMATION</text><text x="72" y="156" font-size="40" font-weight="700">From click to qualified lead.</text></g>
</svg>
